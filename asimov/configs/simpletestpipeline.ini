# Configuration for SimpleTestPipeline, rendered by asimov from
# asimov/configs/simpletestpipeline.ini.
#
# The testing pipelines do no analysis. This file exists so that end-to-end
# tests can check the settings asimov puts into a pipeline's configuration.
# The sections up to [priors] pick out the settings a parameter estimation
# pipeline's template would; [effective settings] lists every setting the
# analysis had when this file was rendered. "<not set>" marks a setting the
# analysis does not have.

[analysis]
name = {{ production.name }}
subject = {{ production.event.name }}
pipeline = {{ pipeline.name }}
comment = {% if production.comment %}{{ production.comment }}{% endif %}

[data]
interferometers = {{ pipeline.setting("interferometers") }}
segment length = {{ pipeline.setting("data", "segment length") }}
channels = {{ pipeline.setting("data", "channels") }}
frame types = {{ pipeline.setting("data", "frame types") }}

[waveform]
approximant = {{ pipeline.setting("waveform", "approximant") }}
reference frequency = {{ pipeline.setting("waveform", "reference frequency") }}
start frequency = {{ pipeline.setting("waveform", "start frequency") }}

[likelihood]
minimum frequency = {{ pipeline.setting("likelihood", "minimum frequency") }}
maximum frequency = {{ pipeline.setting("likelihood", "maximum frequency") }}
sample rate = {{ pipeline.setting("likelihood", "sample rate") }}
psd length = {{ pipeline.setting("likelihood", "psd length") }}

[sampler]
sampler = {{ pipeline.setting("sampler", "sampler") }}

[priors]
{%- for name, value in pipeline.settings_under("priors") %}
{{ name }} = {{ value }}
{%- endfor %}

[effective settings]
{%- for name, value in pipeline.all_settings() %}
{{ name }} = {{ value }}
{%- endfor %}
