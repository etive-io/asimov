# Configuration for ProjectTestPipeline, rendered by asimov from
# asimov/configs/projecttestpipeline.ini.
#
# The testing pipelines do no analysis. This file exists so that end-to-end
# tests can check what asimov gives a pipeline which combines analyses across
# several subjects: [subjects] lists them, [analyses] lists the analyses it
# combines, and [effective settings] lists every setting the analysis had when
# this file was rendered.

[analysis]
name = {{ production.name }}
pipeline = {{ pipeline.name }}
comment = {% if production.comment %}{{ production.comment }}{% endif %}

[subjects]
{%- if production._subjects %}
names = {{ production._subjects | join: ", " }}
{%- else %}
names =
{%- endif %}

[analyses]
{%- assign combined = pipeline.combined_analyses() %}
count = {{ combined | size }}
{%- for analysis in combined %}
{{ analysis.label }} = pipeline: {{ analysis.pipeline }}, status: {{ analysis.status }}, review: {{ analysis.review }}
{%- endfor %}

[effective settings]
{%- for name, value in pipeline.all_settings() %}
{{ name }} = {{ value }}
{%- endfor %}
