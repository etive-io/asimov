name: LDG-parity HTCondor Test
# Runs the same bundled-testing-pipeline flow as testing-pipelines.yml
# (SimpleTestPipeline, SubjectTestPipeline, ProjectTestPipeline, plus
# `asimov monitor start`), but against an HTCondor pool configured to
# enforce the same submission-time policy as the LIGO Data Grid, rather
# than the permissive pool testing-pipelines.yml/htcondor-tests.yml use.
# See tests/fixtures/ldg-condor-config/README.md and
# docs/source/pipelines/e2e-testing-ldg-parity.md for what this policy
# covers, and how it was captured.
#
# Deliberately scoped to what lives in this repo: the full bilby/bayeswave/
# lalinference/pesummary chain in htcondor-tests.yml pulls in several
# separately-maintained plugin packages, and is exactly the piece flagged
# as a candidate to eventually grow into its own review repository rather
# than duplicate wholesale here.
on:
  workflow_dispatch:

jobs:
  ldg-parity:
    name: "HTCondor Testing (LDG parity)"
    runs-on: ubuntu-latest
    container:
      image: htcondor/mini:latest
      options: --privileged
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-htcondor-ldg

      - name: Install base tools
        run: |
          yum install -y sudo git

      - name: Create submit user
        uses: ./.github/actions/create-submit-user

      - name: Ensure submituser can access workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test_project"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Setup Asimov Environment
        uses: ./.github/actions/setup-asimov-env
        with:
          python-version: "3.10"
          conda-packages: ""

      - name: Set up git
        run: |
              su - submituser <<SUBMITUSER
              set -euo pipefail
              git config --global init.defaultBranch master
              git config --global user.email "you@example.com"
              git config --global user.name "Your Name"
              SUBMITUSER

      - name: Create asimov project
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov init "LDG Parity Test Project"

      - name: Configure asimov project for the LDG-parity pool
        uses: ./.github/actions/run-asimov-command
        with:
          script: |
            asimov configuration update condor/user submituser
            asimov configuration update condor/accounting ligo.dev.o4.cbc.pe.bilby
            asimov configuration update condor/cache_time 30
            asimov configuration update condor/cron_minute '*/1'

      - name: Apply testing configuration
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_data/testing_pe.yaml"

      - name: Add test event
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_event.yaml"

      - name: Add SimpleTestPipeline analysis
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/simple_test_pipeline.yaml" -e GW150914_095045

      - name: Build and submit SimpleTestPipeline job
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov manage build submit

      - name: Wait for SimpleTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "results.dat"
          directory: "working/GW150914_095045/test-simple-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .

      - name: Run asimov monitor for SimpleTestPipeline
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor

      - name: Add SubjectTestPipeline analysis
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/subject_test_pipeline.yaml" -e GW150914_095045

      - name: Build and submit SubjectTestPipeline job
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov manage build submit

      - name: Wait for SubjectTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "combined_results.dat"
          directory: "working/GW150914_095045/test-subject-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .

      - name: Run asimov monitor for SubjectTestPipeline
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor

      - name: Add ProjectTestPipeline analysis
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/project_test_pipeline.yaml"

      - name: Build and submit ProjectTestPipeline job
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov manage build submit

      - name: Wait for ProjectTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "population_results.dat"
          directory: "working/project-analyses/GW150914_095045/test-project-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .

      - name: Run asimov monitor for ProjectTestPipeline
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor

      - name: Write pipeline verification script
        run: |
          cat > /tmp/verify_pipelines.py <<'EOF'
          import sys
          from asimov.monitor_api import get_analysis_status
          statuses = get_analysis_status()
          print("Final analysis statuses:")
          failures = []
          for name, status in statuses.items():
              print(f"  {name}: {status}")
              if str(status).lower() != "complete":
                  failures.append(f"{name}: {status}")
          if failures:
              print(f"\nFAIL: {len(failures)} analyses not complete:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print(f"\nAll {len(statuses)} analyses are complete!")
          EOF
          chmod 644 /tmp/verify_pipelines.py

      - name: Verify all testing pipelines completed
        uses: ./.github/actions/run-asimov-command
        with:
          script: python3 /tmp/verify_pipelines.py

      # None of the checks above would fail loudly if condor_submit itself
      # was rejected outright by the LDG-parity policy (accounting group,
      # request_disk, getenv) -- they'd just hang until wait-for-files times
      # out. Dump the queue/history explicitly so a policy rejection is
      # obvious in the logs rather than looking like an unexplained timeout.
      - name: Show HTCondor queue/history for diagnostics
        if: always()
        run: |
          su - submituser -c '
            echo "=== condor_q (submituser) ==="
            condor_q submituser -af ClusterId JobStatus JobBatchName LigoSearchTag LigoSearchUser HoldReason || true
            echo
            echo "=== condor_history (submituser, last 50) ==="
            condor_history submituser -af ClusterId JobStatus JobBatchName HoldReason -limit 50 || true
          '

      - name: Start and check the asimov monitor cron job
        uses: ./.github/actions/run-asimov-command
        with:
          script: |
            asimov monitor start
            sleep 10
            echo "=== asimov monitor cron job ==="
            condor_q submituser -af ClusterId JobStatus JobBatchName HoldReason

      - name: Stop the asimov monitor cron job
        if: always()
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor stop

      - name: Archive artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ldg-parity-debug
          path: |
            .asimov/
            working/
            checkouts/
          retention-days: 5
