name: Database Backend End-to-End Tests

on:
  push:
    branches: [ master, v*-release, v*-preview ]
  pull_request:
    branches: [ master, v*-release, v*-preview ]

jobs:
  database-e2e:
    name: "Database backend end-to-end test"
    runs-on: ubuntu-latest
    container:
      image: htcondor/mini:latest
      options: --privileged
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-htcondor

      - name: Install base tools
        run: yum install -y sudo git

      - name: Create submit user
        uses: ./.github/actions/create-submit-user

      - name: Ensure submituser can access workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test_project"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Setup Asimov Environment
        uses: ./.github/actions/setup-asimov-env
        with:
          python-version: "3.10"
          conda-packages: ""

      - name: Set up git
        run: |
          su - submituser <<SUBMITUSER
          set -euo pipefail
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          SUBMITUSER

      - name: Create asimov project
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov init "Test Project"

      - name: Configure database backend
        uses: ./.github/actions/run-asimov-command
        with:
          script: |
            asimov configuration update ledger/engine sqlalchemy
            asimov configuration update ledger/location .asimov/ledger.db
            asimov configuration update condor/user submituser
            asimov configuration update condor/cache_time 30
            asimov configuration update condor/cron_minute '*/1'

      - name: Apply testing configuration
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_data/testing_pe.yaml"

      - name: Add test event
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_event.yaml"

      - name: Verify event stored in database
        run: |
          python3 - <<'EOF'
          import sqlite3, sys
          conn = sqlite3.connect(".asimov/ledger.db")
          rows = conn.execute("SELECT name FROM events").fetchall()
          names = [r[0] for r in rows]
          print(f"Events in database: {names}")
          if "GW150914_095045" not in names:
              print("FAIL: GW150914_095045 not found in events table")
              sys.exit(1)
          print("PASS")
          conn.close()
          EOF

      - name: Add SimpleTestPipeline analysis
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/simple_test_pipeline.yaml" -e GW150914_095045

      - name: Verify production stored in database
        run: |
          python3 - <<'EOF'
          import sqlite3, sys
          conn = sqlite3.connect(".asimov/ledger.db")
          rows = conn.execute("SELECT name, status FROM productions WHERE event_name='GW150914_095045'").fetchall()
          print(f"Productions: {rows}")
          if not rows:
              print("FAIL: no productions found for GW150914_095045")
              sys.exit(1)
          print("PASS")
          conn.close()
          EOF

      - name: Build and submit SimpleTestPipeline job
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov manage build submit

      - name: Wait for SimpleTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "results.dat"
          directory: "working/GW150914_095045/test-simple-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .

      - name: Run asimov monitor for SimpleTestPipeline
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor

      - name: Verify SimpleTestPipeline status in database
        run: |
          python3 - <<'EOF'
          import sqlite3, sys
          conn = sqlite3.connect(".asimov/ledger.db")
          rows = conn.execute(
              "SELECT name, status FROM productions WHERE event_name='GW150914_095045'"
          ).fetchall()
          print(f"Production statuses: {rows}")
          if not any(status == "complete" for _, status in rows):
              print(f"FAIL: no production reached 'complete' state")
              sys.exit(1)
          print("PASS")
          conn.close()
          EOF

      - name: Add SubjectTestPipeline analysis
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/subject_test_pipeline.yaml" -e GW150914_095045

      - name: Build and submit SubjectTestPipeline job
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov manage build submit

      - name: Wait for SubjectTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "combined_results.dat"
          directory: "working/GW150914_095045/test-subject-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .

      - name: Run asimov monitor for SubjectTestPipeline
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor

      - name: Add ProjectTestPipeline analysis
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/project_test_pipeline.yaml"

      - name: Build and submit ProjectTestPipeline job
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov manage build submit

      - name: Wait for ProjectTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "population_results.dat"
          directory: "working/project-analyses/GW150914_095045/test-project-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .

      - name: Run asimov monitor for ProjectTestPipeline
        uses: ./.github/actions/run-asimov-command
        with:
          script: asimov monitor

      - name: Verify all analyses complete in database
        run: |
          python3 - <<'EOF'
          import sqlite3, sys
          conn = sqlite3.connect(".asimov/ledger.db")

          prods = conn.execute("SELECT name, status FROM productions").fetchall()
          print("Productions:", prods)
          failures = [(n, s) for n, s in prods if s != "complete"]
          if failures:
              print(f"FAIL: {len(failures)} productions not complete: {failures}")
              sys.exit(1)

          proj_analyses = conn.execute("SELECT name, status FROM project_analyses").fetchall()
          print("Project analyses:", proj_analyses)
          proj_failures = [(n, s) for n, s in proj_analyses if s != "complete"]
          if proj_failures:
              print(f"FAIL: {len(proj_failures)} project analyses not complete: {proj_failures}")
              sys.exit(1)

          print(f"PASS: all {len(prods)} productions and {len(proj_analyses)} project analyses complete")
          conn.close()
          EOF

      - name: Archive artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-e2e-debug
          path: |
            .asimov/
            working/
            checkouts/
          retention-days: 5
