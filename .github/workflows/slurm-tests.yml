name: Tests with Slurm
on:
  push:
    paths:
      - 'asimov/scheduler.py'
      - 'asimov/scheduler_utils.py'
      - 'asimov/cli/monitor.py'
      - 'asimov/pipelines/testing/**'
      - '.github/workflows/slurm-tests.yml'
      - '.github/actions/setup-slurm/**'
  pull_request:
    paths:
      - 'asimov/scheduler.py'
      - 'asimov/scheduler_utils.py'
      - 'asimov/cli/monitor.py'
      - 'asimov/pipelines/testing/**'
      - '.github/workflows/slurm-tests.yml'
      - '.github/actions/setup-slurm/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testing-pipelines:
    name: "Testing Pipelines with Slurm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-slurm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install asimov
        run: pip install .

      - name: Set up git
        run: |
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"

      - name: Create asimov project
        run: asimov init "Test Project"

      - name: Configure Slurm scheduler
        run: asimov configuration update scheduler/type slurm

      - name: Apply testing configuration
        run: asimov apply -f "$GITHUB_WORKSPACE/tests/test_data/testing_pe.yaml"

      - name: Add test event
        run: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_event.yaml"

      - name: Add SimpleTestPipeline analysis
        run: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/simple_test_pipeline.yaml" -e GW150914_095045

      - name: Build and submit SimpleTestPipeline job
        run: asimov manage build submit

      - name: Wait for SimpleTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "results.dat"
          directory: "working/GW150914_095045/test-simple-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .
          show-condor-q: "false"

      - name: Run asimov monitor for SimpleTestPipeline
        run: asimov monitor

      - name: Add SubjectTestPipeline analysis
        run: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/subject_test_pipeline.yaml" -e GW150914_095045

      - name: Build and submit SubjectTestPipeline job
        run: asimov manage build submit

      - name: Wait for SubjectTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "combined_results.dat"
          directory: "working/GW150914_095045/test-subject-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .
          show-condor-q: "false"

      - name: Run asimov monitor for SubjectTestPipeline
        run: asimov monitor

      - name: Add ProjectTestPipeline analysis
        run: asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/project_test_pipeline.yaml"

      - name: Build and submit ProjectTestPipeline job
        run: asimov manage build submit

      - name: Wait for ProjectTestPipeline completion
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "population_results.dat"
          directory: "working/project-analyses/GW150914_095045/test-project-pipeline"
          timeout: "300"
          interval: "10"
          working-directory: .
          show-condor-q: "false"

      - name: Run asimov monitor for ProjectTestPipeline
        run: asimov monitor

      - name: Verify all testing pipelines completed
        run: |
          asimov monitor
          python3 <<'EOF'
          import sys
          from asimov.monitor_api import get_analysis_status
          statuses = get_analysis_status()
          print('Final analysis statuses:')
          failures = []
          for name, status in statuses.items():
              print(f'  {name}: {status}')
              if str(status).lower() != 'complete':
                  failures.append(f'{name}: {status}')
          if failures:
              print(f'FAIL: {len(failures)} analyses not complete:')
              [print(f'  - {f}') for f in failures]
              sys.exit(1)
          print(f'All {len(statuses)} analyses are complete!')
          EOF

      - name: Archive artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testing-pipelines-slurm-debug
          path: |
            .asimov/
            working/
            checkouts/
          retention-days: 5

  bilby:
    name: "Bilby end-to-end with Slurm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-slurm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install .
          pip install -U bilby bilby_pipe==1.4.0 "git+https://git.ligo.org/asimov/pipelines/gwdata.git@fix-gwosc-cache" pesummary

      - name: Set up git
        run: |
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"

      - name: Start MockGWDataFindServer
        run: |
          python3 << EOF &
          from tests.mock_gwdatafind_server import MockGWDataFindServer
          import time

          frame_configs = {
              ('H', 'H1_LOSC_16_V1'): ['file://$GITHUB_WORKSPACE/tests/test_data/frames/H-H1_GWOSC_16KHZ_R1-1126259447-32.gwf'],
          }

          server = MockGWDataFindServer(port=8765, frame_configs=frame_configs)
          server.start()
          print("MockGWDataFindServer started on port 8765", flush=True)

          try:
              while True:
                  time.sleep(1)
          except KeyboardInterrupt:
              server.stop()
          EOF

          for i in $(seq 1 15); do
            curl -sf http://localhost:8765/api/v1/gwf/H/H1_LOSC_16_V1/1126259460,1126259464/file.json && break || sleep 2
          done

      - name: Create asimov project
        run: asimov init "Test Project"

      - name: Configure Slurm scheduler
        run: asimov configuration update scheduler/type slurm

      - name: Apply project blueprints
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_quick_test.yaml"
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_event.yaml"

      - name: Submit gwdata job
        env:
          GWDATAFIND_SERVER: http://localhost:8765
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_get_data.yaml" -e GW150914_095045
          asimov manage build submit

      - name: Wait for frame files
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "H*.gwf"
          directory: "working/GW150914_095045/get-data/frames"
          timeout: "600"
          interval: "30"
          working-directory: .
          show-condor-q: "false"

      - name: Wait for gwdata cache file
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "H1.cache"
          directory: "working/GW150914_095045/get-data/cache"
          timeout: "120"
          interval: "10"
          working-directory: .
          show-condor-q: "false"

      - name: Monitor gwdata completion
        run: asimov monitor

      - name: Submit BayesWave PSD job
        env:
          GWDATAFIND_SERVER: https://datafind.gwosc.org
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/bayeswave_quick_test.yaml" -e GW150914_095045
          asimov manage build submit

      - name: Wait for PSD files
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "trigtime_*/post/clean/glitch_median_PSD_forLI_H1.dat"
          directory: "working/GW150914_095045/generate-psd"
          timeout: "600"
          interval: "30"
          working-directory: .
          show-condor-q: "false"

      - name: Clear scheduler cache
        run: rm -f .asimov/_cache_jobs.yaml

      - name: Monitor BayesWave completion
        run: asimov monitor

      - name: Apply and submit Bilby job
        env:
          GWDATAFIND_SERVER: http://localhost:8765
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/bilby_quick_test.yaml" -e GW150914_095045
          asimov manage build submit

      - name: Wait for Bilby result files
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "final_result/*.hdf5"
          directory: "working/GW150914_095045/bilby-IMRPhenomXPHM"
          timeout: "1800"
          interval: "60"
          working-directory: .
          show-condor-q: "false"

      - name: Monitor Bilby completion
        run: |
          asimov monitor
          python3 <<'EOF'
          import sys
          from asimov.monitor_api import get_analysis_status
          statuses = get_analysis_status()
          print('Final analysis statuses:')
          failures = []
          for name, status in statuses.items():
              print(f'  {name}: {status}')
          bilby_status = statuses.get('bilby-IMRPhenomXPHM')
          if str(bilby_status).lower() != 'complete':
              failures.append(f'bilby-IMRPhenomXPHM: {bilby_status}')
          if failures:
              [print(f'FAIL: {failure}') for failure in failures]
              sys.exit(1)
          print('Bilby Slurm end-to-end test completed successfully!')
          EOF

      - name: Archive testing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilby-slurm-artifacts
          path: |
            checkouts/
            working/
            .asimov/
          retention-days: 5

      - name: Stop background server
        if: always()
        run: pkill -f "MockGWDataFindServer" || true
