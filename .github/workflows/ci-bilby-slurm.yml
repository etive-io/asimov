name: Bilby Pipeline CI (Slurm)
on:
  push:
    branches:
      - master
      - "v*-preview"
      - "v*-release"
  pull_request:
    branches:
      - master
      - "v*-preview"
      - "v*-release"
  workflow_dispatch:
    inputs:
      bilby-version:
        description: "bilby pip spec"
        default: "bilby"
        required: false
      bilby-pipe-version:
        description: "bilby_pipe pip spec"
        default: "bilby_pipe==1.4.0"
        required: false
      gwdata-version:
        description: "asimov-gwdata pip spec or git URL"
        default: "git+https://git.ligo.org/asimov/pipelines/gwdata.git@fix-gwosc-cache"
        required: false

permissions:
  contents: read

jobs:
  bilby:
    name: "Bilby end-to-end test (Slurm)"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-slurm

      - name: Setup Asimov Environment
        uses: ./.github/actions/setup-asimov-env
        with:
          python-version: "3.10"
          extra-packages: >-
            -U
            ${{ inputs.bilby-version || 'bilby' }}
            ${{ inputs.bilby-pipe-version || 'bilby_pipe==1.4.0' }}
            "${{ inputs.gwdata-version || 'git+https://git.ligo.org/asimov/pipelines/gwdata.git@fix-gwosc-cache' }}"
            pesummary

      - name: Set up git
        run: |
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"

      - name: Start MockGWDataFindServer
        run: |
          python3 << EOF &
          from tests.mock_gwdatafind_server import MockGWDataFindServer
          import time

          frame_configs = {
              ('H', 'H1_LOSC_16_V1'): ['file://$GITHUB_WORKSPACE/tests/test_data/frames/H-H1_GWOSC_16KHZ_R1-1126259447-32.gwf'],
          }

          server = MockGWDataFindServer(port=8765, frame_configs=frame_configs)
          server.start()
          print("MockGWDataFindServer started on port 8765", flush=True)

          try:
              while True:
                  time.sleep(1)
          except KeyboardInterrupt:
              server.stop()
          EOF

          for i in $(seq 1 15); do
            curl -sf http://localhost:8765/api/v1/gwf/H/H1_LOSC_16_V1/1126259460,1126259464/file.json && break || sleep 2
          done

      - name: Create asimov project
        run: asimov init "Test Project"

      - name: Configure asimov
        run: |
          asimov configuration update scheduler/type slurm
          asimov configuration update scheduler/cache_time 30
          asimov configuration update slurm/partition debug

      - name: Apply project blueprints
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_quick_test.yaml"
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_event.yaml"

      - name: Submit gwdata job
        env:
          GWDATAFIND_SERVER: http://localhost:8765
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/gwosc_get_data.yaml" -e GW150914_095045
          asimov manage build submit

      - name: Wait for frame files
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "H*.gwf"
          directory: "working/GW150914_095045/get-data/frames"
          timeout: "600"
          interval: "30"
          working-directory: .
          show-condor-q: "false"

      - name: Wait for gwdata cache file
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "H1.cache"
          directory: "working/GW150914_095045/get-data/cache"
          timeout: "120"
          interval: "10"
          working-directory: .
          show-condor-q: "false"

      - name: Monitor gwdata completion
        run: asimov monitor

      - name: Show ledger cache state
        run: |
          python3 -c "
          import yaml
          with open('.asimov/ledger.yml') as f:
              ledger = yaml.safe_load(f)
          for ev in ledger.get('events', []):
              data = ev.get('data', {})
              print('Event:', ev.get('name'))
              print('  cache files:', data.get('cache files', 'NOT SET'))
              for prod_dict in ev.get('productions', []):
                  for pname, prod in prod_dict.items():
                      print(f'  {pname}: {prod.get(\"status\")}')
          "

      - name: Submit BayesWave PSD job
        env:
          GWDATAFIND_SERVER: https://datafind.gwosc.org
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/bayeswave_quick_test.yaml" -e GW150914_095045
          asimov manage build submit

      - name: Show generated BayesWave INI
        run: find checkouts/ -name "generate-psd.ini" -exec cat {} \; 2>/dev/null || echo "No generate-psd.ini found"

      - name: Wait for PSD files
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "trigtime_*/post/clean/glitch_median_PSD_forLI_H1.dat"
          directory: "working/GW150914_095045/generate-psd"
          timeout: "600"
          interval: "30"
          working-directory: .
          show-condor-q: "false"
          show-squeue: "true"

      - name: BayesWave diagnostics on failure
        if: failure()
        run: |
          echo "=== Slurm job history ==="
          squeue --format="%.10i %.30j %.8T %.10M %.10R" --all || true
          sacct --format="JobID,JobName%30,State,ExitCode,MaxRSS,Elapsed" --allusers 2>/dev/null || true
          echo "=== BayesWave run scripts ==="
          find working/GW150914_095045/generate-psd -name "*_run.sh" | while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done
          echo "=== BayesWave Slurm job output ==="
          find working/GW150914_095045/generate-psd -name "*.out" -o -name "*.err" | while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done
          echo "=== BayesWave INI ==="
          find checkouts/GW150914_095045 -name "generate-psd.ini" -exec cat {} \; 2>/dev/null || true
          echo "=== asimov log ==="
          cat .asimov/asimov.log 2>/dev/null || true

      - name: Cancel BayesWave megaplot job and clear cache
        run: |
          scancel -u "$(whoami)" || true
          rm -f .asimov/_cache_jobs.yaml

      - name: Monitor BayesWave completion
        run: asimov monitor

      - name: Apply and submit Bilby job
        env:
          GWDATAFIND_SERVER: http://localhost:8765
        run: |
          asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/bilby_quick_test.yaml" -e GW150914_095045
          asimov manage build submit

      - name: Wait for Bilby result files
        uses: ./.github/actions/wait-for-files
        with:
          patterns: "final_result/*.hdf5"
          directory: "working/GW150914_095045/bilby-IMRPhenomXPHM"
          timeout: "1800"
          interval: "60"
          working-directory: .
          show-condor-q: "false"

      - name: Monitor Bilby completion
        run: |
          check_status() {
            python3 - <<PYEOF
          from asimov.monitor_api import get_analysis_status
          print(get_analysis_status().get('bilby-IMRPhenomXPHM', 'unknown'))
          PYEOF
          }
          for attempt in $(seq 1 15); do
            asimov monitor
            status=$(check_status)
            echo "Attempt ${attempt}/15: bilby-IMRPhenomXPHM = ${status}"
            squeue --format="%.10i %.30j %.8T %.10M %.20R" --all || true
            if [ "${status}" = "complete" ]; then
              echo "Bilby Slurm end-to-end test completed successfully!"
              exit 0
            fi
            sleep 60
          done
          echo "Timeout: bilby-IMRPhenomXPHM did not reach complete within 15 minutes"
          check_status
          exit 1

      - name: Archive testing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilby-slurm-artifacts
          path: |
            checkouts/
            working/
            .asimov/
          retention-days: 5

      - name: Stop background server
        if: always()
        run: pkill -f "MockGWDataFindServer" || true
