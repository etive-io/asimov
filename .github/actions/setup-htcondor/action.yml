name: 'Setup HTCondor'
description: 'Start and verify HTCondor service'
runs:
  using: "composite"
  steps:
    - name: Start HTCondor
      shell: bash
      run: |
        condor_master &
        for i in $(seq 1 30); do
          condor_status && break || sleep 3
        done
        condor_status

    - name: Cap memory requests for CI
      shell: bash
      run: |
        cat > /etc/condor/config.d/99-ci-memory-cap.conf << 'EOF'
        # Pipeline defaults (e.g. bilby_pipe's MergeNode) can request
        # more memory than a CI runner has.  Cap everything at 4 GB so
        # jobs always match the local slot without changing any pipeline
        # code or templates.
        JOB_TRANSFORM_NAMES = CapMemoryForCI
        JOB_TRANSFORM_CapMemoryForCI @=end
          if RequestMemory > 4096
            SET RequestMemory = 4096
          endif
        @end
        EOF
        condor_reconfig
