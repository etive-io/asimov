name: 'Collect Test Outputs'
description: >
  Generate the asimov HTML report and upload the outputs of an end-to-end test
  as a workflow artifact, so that reviewers can download and inspect them: the
  report; every analysis's working directory, with its ledger dump, rendered
  configuration and job output (also gathered into ledger-dumps/, configs/ and
  job-outputs/); the ledger; and the project configuration. Always uploads,
  whether or not the test passed. Run it as one of the last steps, with
  `if: always()`.
inputs:
  name:
    description: 'Name of the artifact to upload'
    required: true
  report-dir:
    description: 'Where to write the HTML report (relative to GITHUB_WORKSPACE)'
    default: 'report'
    required: false
  retention-days:
    description: 'How long to keep the artifact'
    default: '14'
    required: false

runs:
  using: "composite"
  steps:
    - name: Generate the HTML report
      # A failure to build the report must not hide the other outputs.
      if: always()
      continue-on-error: true
      uses: ./.github/actions/run-asimov-command
      with:
        script: |
          mkdir -p "${{ inputs.report-dir }}"
          asimov report html --location "$GITHUB_WORKSPACE/${{ inputs.report-dir }}"

    - name: Gather the ledger dumps, configurations and job output
      if: always()
      shell: bash {0}
      run: |
        # Collect each testing pipeline's ledger dump, rendered configuration
        # and job standard output in one place, named after the analysis, so
        # a reviewer can read them without hunting through working/.
        cd "$GITHUB_WORKSPACE"
        mkdir -p ledger-dumps configs job-outputs
        find working -name ledger_dump.json 2>/dev/null | while read -r f; do
          cp "$f" "ledger-dumps/$(basename "$(dirname "$f")").json" || true
        done
        find working -name config.ini 2>/dev/null | while read -r f; do
          cp "$f" "configs/$(basename "$(dirname "$f")").ini" || true
        done
        find working \( -name 'test*_job.out' -o -name 'slurm_*.out' -o -name 'local_job.out' \) 2>/dev/null | while read -r f; do
          cp "$f" "job-outputs/$(basename "$(dirname "$f")").out" || true
        done
        ls -la ledger-dumps configs job-outputs || true

    - name: Upload test outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: |
          ${{ inputs.report-dir }}/
          ledger-dumps/
          configs/
          job-outputs/
          working/
          .asimov/
          checkouts/
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
