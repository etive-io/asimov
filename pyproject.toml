[build-system]
requires = [
	"setuptools>=61.0",
	"setuptools_scm[toml]>=3.4.3",
	"wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[project]
name = "asimov"
dynamic = ["version"]
authors = [
	{ name = "Daniel Williams", email = "daniel.williams@ligo.org" },
]
description = "A Python package for managing and interacting with data analysis jobs."
readme = "README.md"
license = { file = "LICENSE" } 
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Science/Research',
        'Topic :: Scientific/Engineering :: Astronomy',
        'Topic :: Scientific/Engineering :: Information Analysis',
        'Natural Language :: English',
]
requires-python = ">=3.9"
dependencies = [
	     "setuptools",
	     "click",
	     "gitpython",
	     "htcondor",
	     "liquidpy",
	     "networkx",
	     "numpy",
	     "otter-report>=0.3.3",
	     "python-gitlab",
	     "pytz",
	     "pyyaml",
	     "requests",
	     "flask",
	     "flask-cors>=4.0.0",
	     "filelock>=3.13.0",
	     "tinydb",
	     "pillow>=10.2.0",
	     "pydantic>=2.0.0",
	     "sqlalchemy>=2.0.0",
	     "alembic>=1.13.0",
]

[project.optional-dependencies]
docs = [
	# sphinx-multiversion (unmaintained upstream) calls Config.read() with
	# overrides/tags as positional args, which Sphinx 9 made keyword-only.
	"sphinx<9",
	"kentigern >= 0.3.0",
    "numpydoc",
	"sphinx-click",
	"sphinxcontrib-httpdomain",
	"sphinxcontrib-httpexample",
	"sphinx-jsonschema",
	"sphinx-multiversion",
	"autodoc-pydantic",
]
lvkgw = [
	"bilby_pipe",
	"asimov-pesummary",
	"asimov-bayeswave",
	"asimov-gwdata",
]
lvkgw-extras = [
	"asimov-lalinference",
]
bilby = [
	"bilby_pipe",
	"bilby",
]
slurm = [
	"python-crontab",
]
testing = []

[project.scripts]
olivaw = "asimov.olivaw:olivaw"
asimov = "asimov.olivaw:olivaw"
locutus = "asimov.locutus:cli"

[project.urls]
"Source code" = "https://git.ligo.org/asimov/asimov"

[tool.setuptools]
include-package-data = true
packages = [
	"asimov",
	"asimov.pipelines",
	"asimov.pipelines.testing",
	"asimov.cli",
	"asimov.configs",
	"asimov.api",
	"asimov.api.blueprints"
]

[tool.setuptools.package-data]
"asimov.cli" = ["report-theme/*", "static/*.js"]

[project.entry-points."asimov.pipelines"]
simpletestpipeline = "asimov.pipelines.testing:SimpleTestPipeline"
simpletestpipelineb = "asimov.pipelines.testing:SimpleTestPipelineB"
simpletestpipelinec = "asimov.pipelines.testing:SimpleTestPipelineC"
subjecttestpipeline = "asimov.pipelines.testing:SubjectTestPipeline"
projecttestpipeline = "asimov.pipelines.testing:ProjectTestPipeline"

# Entry point group for external telemetry sinks. Every event is always
# recorded locally regardless of what's registered here (see
# asimov.telemetry.LocalJSONLSink); sinks discovered through this group are
# opt-in extras for forwarding the same events to a larger observability
# stack. See docs/source/hooks.rst.
# Example: my_sink = "my_package.telemetry:MySink"
[project.entry-points."asimov.hooks.telemetry"]
prometheus = "asimov.telemetry:PrometheusPushgatewaySink"

# Entry point group for labeller plugins
# Labellers can automatically assign labels like "interest status" to analyses
# during monitoring. See docs/source/labeller-plugins.rst for details.
[project.entry-points."asimov.labellers"]
# Example: my_labeller = "my_package.labellers:MyLabeller"
